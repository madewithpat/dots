setupVersion: 2
statusLine:
  preset: custom
  separator: none
  transparent: true
  leftSegments:
    - model
    - path
    - git
    - usage
  rightSegments:
    - mode
    - token_in
    - token_out
  segmentOptions:
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    model:
      showThinkingLevel: false
  contextLine: embedded
  compactThinkingLevel: true
github:
  enabled: true
vault:
  enabled: true
task:
  eager: preferred
  enableLsp: true
  maxConcurrency: 8
  enableEffort: true
  maxRecursionDepth: 1
  showResolvedModelBadge: true
composer:
  shape: rule
modelRoles:
  default: anthropic/claude-sonnet-5
  smol: anthropic/claude-haiku-4-5
  slow: anthropic/claude-opus-5
defaultThinkingLevel: auto
theme:
  dark: dark-tokyo-night
  light: light-tokyo-night
symbolPreset: nerd
display:
  showTokenUsage: true
