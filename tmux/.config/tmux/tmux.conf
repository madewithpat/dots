# =============================================================================
# General
# =============================================================================

# Set prefix to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Cheatsheet popup
bind ? display-popup -h 80% -w 60% "cat ~/.config/tmux/cheatsheet"

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on

set -g detach-on-destroy off  # don't exit from tmux when closing a session
setw -g allow-rename off

# Increase scrollback buffer
set -g history-limit 10000

# Reduce escape time (important for neovim/vim)
set -sg escape-time 10

# Pass extended keys (Shift+Enter, etc.) through to applications
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on

# Enable focus events (for vim autoread)
set -g focus-events on

# =============================================================================
# Session stuff
# =============================================================================

# fzf picker for sessions with sesh
bind-key "s" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --layout=reverse \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'if tmux has-session -t {2..} 2>/dev/null; then tmux capture-pane -ep -t {2..}; else sesh preview {}; fi'
)\""

bind-key "F" display-popup -h 90% -w 50% -E "sesh picker -i"

bind C-w display-popup -h 40 -w 150 -E "workmux dashboard"

# =============================================================================
# Display
# =============================================================================

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Pane borders (Tokyo Night Moon)
set -g pane-border-lines heavy
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#c099ff"

# Styles from official tokyonight extras
# https://github.com/folke/tokyonight.nvim/blob/main/extras/tmux/tokyonight_moon.tmux
# set -g mode-style "fg=#82aaff,bg=#3b4261"
#
# set -g message-style "fg=#82aaff,bg=#3b4261"
# set -g message-command-style "fg=#82aaff,bg=#3b4261"
#
# Status bar refresh interval
set -g status-interval 5

# =============================================================================
# Status Bar
# =============================================================================

set -g status-position    top

# available plugins: battery, cpu-usage, git, gpu-usage, ram-usage, tmux-ram-usage, network, network-bandwidth, network-ping, ssh-session, attached-clients, network-vpn, weather, time, mpc, spotify-tui, playerctl, kubernetes-context, synchronize-panes
set -g @ukiyo-plugins "cwd time"
set -g @ukiyo-show-powerline true
set -g @ukiyo-show-empty-plugins true
# set -g @ukiyo-cwd-max-dirs "3"   # max number of path segments to show
set -g @ukiyo-cwd-max-chars "0"  # max total characters (0 = unlimited)
# set -g @ukiyo-show-left-sep 
# set -g @ukiyo-time-format "%H:%M"
# set -g @ukiyo-show-right-sep
set -g mouse on

# =============================================================================
# Key bindings
# =============================================================================

# Vim-style pane navigation (prefix+hjkl still works as fallback)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Seamless navigation between nvim splits and tmux panes (nvim-tmux-navigation)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Split panes with | and - (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Kill pane/window without confirmation
bind x kill-pane
bind & kill-window

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Join pane from another window via fzf
bind @ display-popup -h 70% -w 90% -E "tmux list-panes -a -F '\#{pane_id}|\#{session_name}|\#{window_index}|\#{pane_index}|\#{session_name} > \#{window_name}:\#{pane_index} \#{pane_current_command} (\#{b:pane_current_path})' | grep -v '^#{pane_id}|' | sort -t'|' -k2,2 -k3,3n -k4,4n | cut -d'|' -f1,5 | fzf --no-sort --delimiter='|' --with-nth=2 --preview-window 'right:60%' --preview 'tmux capture-pane -ep -t {1}' | cut -d'|' -f1 | xargs -I{} tmux join-pane -s {}"

# Cycle pane layouts
bind Tab next-layout

# Resize panes with vim keys (hold prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =============================================================================
# Copy mode (vim-style)
# =============================================================================

setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# =============================================================================
# Plugins (TPM)
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # Sensible defaults
# set -g @plugin 'phil/tmux-devcontainers'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'Nybkox/tmux-ukiyo'
set -g @ukiyo-theme "tokyonight/moon"

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
