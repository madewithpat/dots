setupVersion: 2
statusLine:
  preset: custom
  separator: none
  transparent: true
  leftSegments:
    - model
    - path
    - git
    - usage
  rightSegments:
    - mode
    - token_in
    - token_out
  segmentOptions:
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    model:
      showThinkingLevel: true
  contextLine: embedded
github:
  enabled: true
vault:
  enabled: true
task:
  eager: preferred
  enableLsp: true
  maxConcurrency: 8
  enableEffort: true
  maxRecursionDepth: 1
  showResolvedModelBadge: true
composer:
  shape: rule
modelRoles:
  default: anthropic/claude-opus-5-5
  tiny: apple/on-device
defaultThinkingLevel: auto
theme:
  dark: dark-tokyo-night
  light: light-tokyo-night
symbolPreset: nerd
display:
  showTokenUsage: true
